<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — eDiye studio</title>
  <link rel="icon" href="assets/images/ljCwDyWpHUcR27Eh2oMvudEmA.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-hero { padding: 140px 0 60px; }
  </style>
</head>
<body>
  <header class="announcement-bar">
    <span class="announcement-dot"></span>
    <a href="index.html#pricing"><span>NEW eDiye® PRICING</span><span>•</span><span>LEARN MORE</span></a>
    <span class="announcement-dot"></span>
  </header>

  <div class="navbar-wrapper">
    <nav class="navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="logo-text" style="color: #000000;">eDiye<span class="reg">®</span></div>
        <div class="logo-sub">Clarity over clutter.</div>
      </a>
      <div class="nav-pills-group">
        <a href="about.html" class="nav-pill-btn">About</a>
        <a href="works.html" class="nav-pill-btn">Projects</a>
        <a href="shopify.html" class="nav-pill-btn">Shopify</a>
        <a href="articles.html" class="nav-pill-btn">Articles</a>
        <a href="contact.html" class="nav-pill-btn active">Contact</a>
      </div>
      <button class="nav-mobile-toggle" aria-label="Toggle Menu">Menu</button>
    </nav>
  </div>

  <main class="page-hero">
    <div class="container">
      <div class="badge-tag" style="margin-bottom: 20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>Get in Touch</span>
      </div>

      <h1 class="section-hero-title">Let's build something exceptional.</h1>
      <div class="section-hero-subtitle">Tell us about your brand, timeline, and goals.</div>

      <div style="max-width: 680px; margin-top: 50px; margin-bottom: 80px;">
        <form class="contact-form" id="page-contact-form" style="background:#ffffff; padding:44px; border-radius:var(--radius-xl); border:1px solid #e8e8e8; box-shadow:var(--shadow-sm);">
          <div class="form-group">
            <label for="p-name" class="form-label" style="color:#555;">Name *</label>
            <input type="text" id="p-name" class="form-input" placeholder="Your name" style="color:#000; border-bottom:1px solid #d0d0d0;" required>
          </div>

          <div class="form-group" style="margin-top: 20px;">
            <label for="p-email" class="form-label" style="color:#555;">E-mail *</label>
            <input type="email" id="p-email" class="form-input" placeholder="name@company.com" style="color:#000; border-bottom:1px solid #d0d0d0;" required>
          </div>

          <div class="form-group" style="margin-top: 20px;">
            <label for="p-goals" class="form-label" style="color:#555;">Project and goals *</label>
            <textarea id="p-goals" class="form-textarea" placeholder="Tell us what you want to achieve..." style="color:#000; border-bottom:1px solid #d0d0d0;" required></textarea>
          </div>

          <button type="submit" class="btn-dark-pill" style="margin-top: 30px; width:100%; padding:16px; font-size:16px; justify-content:center;">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-main-grid">
        <div class="footer-brand-side">
          <div class="footer-brand-logo">eDiye®</div>
          <div class="footer-tagline">Clarity over clutter.</div>
        </div>
      </div>
    </div>
    <div class="footer-bottom-bar">
      <div>© 2025 eDiye. All rights reserved.</div>
      <div>Created by @Dennis</div>
    </div>
  </footer>
  <script src="js/main.js"></script>
    <!-- Progressive Liquid Glass Bottom Blur Overlay -->
  <div class="viewport-liquid-glass" aria-hidden="true"></div>
</body>
</html>
