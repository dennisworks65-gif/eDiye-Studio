<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — eDiye® Studio</title>
  <link rel="icon" href="../assets/images/ljCwDyWpHUcR27Eh2oMvudEmA.png">
</head>
<body>
  <!-- Manual initialization to dynamically set Vercel OAuth base_url -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'dennisworks65-gif/eDiye-Studio',
          branch: 'main',
          base_url: window.location.origin,
          auth_endpoint: 'api/auth'
        },
        local_backend: isLocal
      }
    });
  </script>
  <!-- Vercel Web Analytics & Speed Insights Telemetry -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
