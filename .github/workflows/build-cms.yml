name: Build Case Studies from CMS

on:
  push:
    paths:
      - 'content/projects/**'
      - 'content/articles/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Project HTML Pages
        run: node scripts/build-projects.js

      - name: Commit and push generated HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add works/*.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cms): auto-generate case study HTML from CMS updates [skip ci]"
            git push
          fi
